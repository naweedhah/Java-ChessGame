name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test and package
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: java-chess
          path: target/java-chess.jar

  release:
    # Pushing a tag like v2.0.0 publishes the runnable jar as a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: java-chess
      - uses: softprops/action-gh-release@v2
        with:
          files: java-chess.jar
          generate_release_notes: true
